name: CI — Programmable TypeScript 6.0.3 Verification

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify-ts-6:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run Compiler Verification Suite & Zero-AST Benchmark
        run: |
          node --test test/v8-compiler-opt.test.mts
          node benchmark/zero-ast-vs-tsc.mts
